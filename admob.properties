# Single source for application ID, units and optional hashed QA test-device IDs.
# profile=production uses your units in every build. Emulators automatically receive test ads.
# Physical QA: add SDK logcat test-device hashes below (comma separated), rebuild, verify Test Ad.
# profile=test selects Google demo inventory. Production serving requires AdMob account approval.
# Independent demo QA without changing this file: gradlew.bat :app:assembleDebug -PadmobProfile=test
profile=production
# Debug only: if a production load fails, try a demo unit on an SDK-marked test device.
# Release builds always disable this fallback; consent and the kill switch still apply.
# A fallback cannot repair missing production UMP messages; use the complete test profile for demo QA.
qa.fallback=true
test.app=ca-app-pub-3940256099942544~3347511713
test.rewarded=ca-app-pub-3940256099942544/5224354917
test.interstitial=ca-app-pub-3940256099942544/1033173712
test.banner=ca-app-pub-3940256099942544/9214589741
production.app=ca-app-pub-6926810742930516~9728984035
production.rewarded=ca-app-pub-6926810742930516/4988240353
production.interstitial=ca-app-pub-6926810742930516/6590105790
production.banner=ca-app-pub-6926810742930516/8854886068

# SDK registration: paste 32-character hashes from the Ads logcat hint, comma separated.
# Leave empty for public release. Emulator test registration is automatic.
test.devices=
# Reference only: register this advertising-ID UUID in AdMob Settings > Test devices.
# This value is not passed to RequestConfiguration.setTestDeviceIds().
test.dashboard.advertising_ids=87c74ea8-b34e-4d36-a8a4-f12cb21f8891
